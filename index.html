<body>

<header>
  <h1>🔥 C4Printz 🔥</h1>
  <p>www.c4printz.com • Custom 3D Prints • Fast • High Quality</p>
</header>

<section class="products">

  <!-- Mini Dragon -->

    <img src="https://via.placeholder.com/200">
    <h2>Mini Dragon</h2>

```
<label>Size:</label>
<select onchange="updatePrice(this, 'dragonPrice')">

</select>

<p id="dragonPrice">$5</p>

```

  </div>

  <!-- Phone Stand -->

  <div class="product">
    <img src="https://via.placeholder.com/200">
    <h2>Phone Stand</h2>

```
<label>Size:</label>
<select onchange="updatePrice(this, 'standPrice')">
  <option value="5">Small ($5)</option>
  <option value="10">Medium ($10)</option>
  <option value="15">Large ($15)</option>
</select>

<p id="standPrice">$5</p>

<button onclick="orderNow()">Order Now</button>
```

  </div>

  <!-- Custom Print -->

  <div class="product">
    <img src="https://via.placeholder.com/200" id="customPreview">
    <h2>Custom 3D Print</h2>

```
<label>Size:</label>
<select onchange="updatePrice(this, 'customPrice')">
  <option value="5">Small ($5)</option>
  <option value="10">Medium ($10)</option>
  <option value="15">Large ($15)</option>
</select>

<p id="customPrice">$5</p>

<label>Upload your file:</label>
<input type="file" accept="image/*,.stl,.obj" onchange="previewFile(event)">
<p id="fileName">No file selected</p>

<button onclick="orderNow()">Order Now</button>
```

  </div>

</section>

<footer>
  <p>🌐 www.c4printz.com</p>
  <p>📧 c4rocks@icloud.com</p>
</footer>

<script>
function updatePrice(select, id) {
  document.getElementById(id).innerText = "$" + select.value;
}

function previewFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  document.getElementById("fileName").innerText = file.name;

  if (file.type.startsWith("image/")) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById("customPreview").src = e.target.result;
    }
    reader.readAsDataURL(file);
  }
}

function orderNow() {
  alert("Order received! Next step: connect payments + file sending.");
}
</script>

</body>
</html>
